name: Keep Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # 매월 1일 자정 실행
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflow active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u +%Y-%m)" > .github/last-alive.txt
          git add .github/last-alive.txt
          git commit -m "chore: keep workflow alive [skip ci]" || echo "nothing to commit"
          git push
